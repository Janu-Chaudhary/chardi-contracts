name: Weekly State Portals Ingestion

on:
  schedule:
    # Every Sunday at 08:00 UTC
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      portal:
        description: 'Portal to run (all | california | texas | newyork | virginia)'
        required: false
        default: 'all'

jobs:
  ingest-newyork:
    name: New York (NYSCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.portal == 'all' || github.event.inputs.portal == 'newyork' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m backend.workers.newyork.main
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: Janu-Chaudhary-ChardiAI-Trial/1.0

  ingest-texas:
    name: Texas (TxSmartBuy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.portal == 'all' || github.event.inputs.portal == 'texas' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - run: python -m backend.workers.texas.main
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: Janu-Chaudhary-ChardiAI-Trial/1.0

  ingest-california:
    name: California (Cal eProcure)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.portal == 'all' || github.event.inputs.portal == 'california' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - run: python -m backend.workers.california.main
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: Janu-Chaudhary-ChardiAI-Trial/1.0

  ingest-virginia:
    name: Virginia (eVA + VITA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.portal == 'all' || github.event.inputs.portal == 'virginia' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m backend.workers.virginia.main
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: Janu-Chaudhary-ChardiAI-Trial/1.0
