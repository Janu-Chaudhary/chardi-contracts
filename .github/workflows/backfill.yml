name: Manual Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to backfill (e.g. 30)'
        required: true
        default: '30'
      portal:
        description: 'Portal to backfill (samgov)'
        required: false
        default: 'samgov'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    name: Backfill ${{ github.event.inputs.portal }} (${{ github.event.inputs.days }} days)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backfill
        run: |
          echo "Backfilling ${{ github.event.inputs.portal }} for ${{ github.event.inputs.days }} days..."
          python -m backend.workers.samgov.main --days ${{ github.event.inputs.days }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          USER_AGENT: Janu-Chaudhary-ChardiAI-Trial/1.0
          REQUEST_TIMEOUT_SECONDS: '90'

      - name: Verify results
        run: python scripts/smoke_test.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
