name: Daily SAM.gov Ingestion

on:
  schedule:
    # Every day at 06:00 UTC (after SAM.gov daily quota resets at 00:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to ingest (default: 1)'
        required: false
        default: '1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ingest:
    name: SAM.gov federal ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run SAM.gov ingestion
        run: |
          DAYS=${{ github.event.inputs.days || '1' }}
          echo "Running SAM.gov ingestion for $DAYS day(s)..."
          python -m backend.workers.samgov.main --days $DAYS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          USER_AGENT: Janu-Chaudhary-ChardiAI-Trial/1.0
          REQUEST_TIMEOUT_SECONDS: '60'

      - name: Verify ingestion
        run: python scripts/smoke_test.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
