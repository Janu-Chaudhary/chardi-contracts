name: Daily Full Ingestion (All Portals - 30 Days)

on:
  schedule:
    # Every day at 06:00 UTC (SAM.gov quota resets at 00:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
  USER_AGENT: Janu-Chaudhary-ChardiAI-Trial/1.0
  REQUEST_TIMEOUT_SECONDS: '90'

jobs:

  # ── Federal ──────────────────────────────────────────────────────────────────
  samgov:
    name: SAM.gov (Federal) — 30 days
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Ingest SAM.gov
        run: python -m backend.workers.samgov.main --days 30

  # ── New York ─────────────────────────────────────────────────────────────────
  newyork:
    name: New York (NYSCR) — 30 days
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ingest New York
        run: python -m backend.workers.newyork.main

  # ── California ───────────────────────────────────────────────────────────────
  california:
    name: California (Cal eProcure) — 30 days
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ingest California
        run: python -m backend.workers.california.main

  # ── Texas ────────────────────────────────────────────────────────────────────
  texas:
    name: Texas (TxSmartBuy) — 30 days
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ingest Texas
        run: python -m backend.workers.texas.main

  # ── Virginia ─────────────────────────────────────────────────────────────────
  virginia:
    name: Virginia (eVA + VITA) — 30 days
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Ingest Virginia
        run: python -m backend.workers.virginia.main

  # ── Smoke test (runs after all portals finish) ────────────────────────────────
  verify:
    name: Verify — smoke test
    runs-on: ubuntu-latest
    needs: [samgov, newyork, california, texas, virginia]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run smoke test
        run: python scripts/smoke_test.py
